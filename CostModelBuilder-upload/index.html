<!doctype html>
<!--
DIRECTION CONTRACT · seed 3bc109dd · candidate #4 (site-survey clipboard) fused with challenger "Japanese high-density web" + staging "trim-and-launch"
THESIS: Pricing a tender is a site survey done on paper: every line gets ticked from the document, answered, or marked in red for follow-up. The tool is that survey sheet, and it finishes as a price.
OWN-WORLD: Surveyor's ruled sheet on a clipboard. Warm paper, graphite ink, hairline rules, a dense module mosaic, and utility red kept only for "still needs an answer".
STORY: Load documents → tick what was found → answer the red marks → trim the levers → launch a run → trace and compare runs → hand to the workbook.
FIRST VIEWPORT: Left, a checklist rail of the seven survey stages with tick state. Centre, the ruled work sheet. Right, a price trace strip that is always visible: weekly and annual charge, margin stack, open reds.
FORM: Light paper surface (office daylight, desk use). One system sans, tabular figures. Hairline 1px rules, no cards-as-structure. Source marks as small ink stamps. Motion only for state (150–200ms).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1.5' y='1.5' width='13' height='13' rx='1' fill='%23fffdf8' stroke='%231c1e21'/%3E%3Cpath d='M4 8.2l2.6 2.6L12 5.4' fill='none' stroke='%231c1e21' stroke-width='1.6'/%3E%3C/svg%3E">
<title>Cost Model Builder · Tender survey</title>
<style>
:root{
  --paper:#f6f4ee; --sheet:#fffdf8; --rail:#ecE9e0; --ink:#1c1e21; --ink-2:#4a4d52; --ink-3:#5d5f63;
  --rule:#d9d5c9; --rule-strong:#b9b4a5; --red:#b8321f; --red-wash:#fbeae6; --red-ink:#8e2415;
  --doc:#1f5a9e; --doc-wash:#e7eff9; --ans:#2c6a39; --ans-wash:#e6f2e8; --bm:#7c5300; --bm-wash:#f8efdb;
  --def:#5b5d61; --def-wash:#eeeeec; --focus:#1f5a9e; --ok:#2c6a39; --warn:#7c5300;
  --r:3px; --fs-xs:.75rem; --fs-s:.8125rem; --fs-m:.9375rem; --fs-l:1.125rem; --fs-xl:1.375rem; --fs-xxl:1.75rem;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-size:var(--fs-m);line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:var(--fs-l)} h2{font-size:var(--fs-xl);margin-bottom:.35rem} h3{font-size:var(--fs-m);margin:1.4rem 0 .5rem}
p{margin:.25rem 0 .75rem;max-width:72ch}
.muted{color:var(--ink-2)} .small{font-size:var(--fs-s)} .xs{font-size:var(--fs-xs)}
.num{text-align:right;white-space:nowrap}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;grid-template-rows:auto 1fr;height:100vh}
.top{grid-column:1/-1;display:flex;align-items:center;gap:1rem;padding:.55rem 1rem;border-bottom:1px solid var(--rule-strong);background:var(--sheet)}
.top .opp{display:flex;gap:.5rem;align-items:baseline;min-width:0}
.top .opp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .spacer{flex:1}
.host{font-size:var(--fs-xs);border:1px solid var(--rule-strong);padding:.15rem .45rem;border-radius:var(--r);color:var(--ink-2)}
.host[data-mode="cowork"],.host[data-mode="managed"]{border-color:var(--ans);color:var(--ans)}
.host[data-mode="untrusted"]{border-color:var(--red);color:var(--red-ink)}

/* Rail: survey checklist */
.rail{background:var(--rail);border-right:1px solid var(--rule-strong);overflow:auto;padding:.75rem 0}
.rail ol{list-style:none;margin:0;padding:0}
.rail li button{display:grid;grid-template-columns:22px 1fr auto;gap:.55rem;align-items:center;width:100%;text-align:left;
  background:none;border:0;border-bottom:1px solid var(--rule);padding:.6rem .9rem;cursor:pointer}
.rail li button:hover{background:#e3dfd3}
.rail li button[aria-current="step"]{background:var(--sheet);box-shadow:inset 3px 0 0 var(--ink)}
.rail .box{width:18px;height:18px;border:1.5px solid var(--ink-2);border-radius:2px;display:grid;place-items:center;font-size:12px;line-height:1;background:var(--sheet)}
.rail .done .box{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.rail .lbl{font-size:var(--fs-s);font-weight:500}
.rail .lbl small{display:block;font-weight:400;color:var(--ink-3);font-size:var(--fs-xs)}
.rail .reds{font-size:var(--fs-xs);color:var(--red-ink);font-weight:600}
.rail .foot{padding:.9rem;font-size:var(--fs-xs);color:var(--ink-2)}

/* Sheet */
.main{overflow:auto;background:var(--paper)}
.sheet{background:var(--sheet);margin:1rem;border:1px solid var(--rule-strong);padding:1.25rem 1.5rem 2rem;min-height:calc(100% - 2rem);
  background-image:linear-gradient(var(--sheet),var(--sheet));}
.sheet > header{display:flex;gap:1rem;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
section[hidden]{display:none}

/* Controls */
.btn{border:1px solid var(--ink);background:var(--sheet);padding:.42rem .85rem;border-radius:var(--r);cursor:pointer;font-size:var(--fs-s);font-weight:500;min-height:34px}
.btn:hover{background:#f0ede4}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.primary:hover{background:#34373b}
.btn.ghost{border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn[aria-busy="true"]{cursor:progress;opacity:.75}
input[type=text],input[type=number],input[type=date],select,textarea{border:1px solid var(--rule-strong);background:#fff;border-radius:var(--r);padding:.35rem .5rem;min-height:32px;width:100%}
input:hover,select:hover{border-color:var(--ink-3)}
input[aria-invalid="true"]{border-color:var(--red);background:var(--red-wash)}
input[type=number]{text-align:right}
label.f{display:grid;gap:.2rem;font-size:var(--fs-s);font-weight:500}
.hint{font-size:var(--fs-xs);color:var(--ink-2);font-weight:400}
.err{font-size:var(--fs-xs);color:var(--red-ink);font-weight:500}
input[type=checkbox]{width:16px;height:16px;margin:.15rem 0 0;accent-color:var(--ink);flex:none}
label.chk{display:flex;gap:.55rem;align-items:flex-start;font-size:var(--fs-s);max-width:70ch;cursor:pointer}

/* Saved work, approval route, sign-off, question feedback */
.resume{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between;border:1px solid var(--rule-strong);border-left:3px solid var(--ink);background:var(--sheet);padding:.7rem .9rem;margin:0 0 1.2rem;border-radius:var(--r)}
.resume b{display:block}
.route{list-style:none;margin:.3rem 0 1rem;padding:0;border-top:1px solid var(--rule);counter-reset:r}
.route li{display:grid;grid-template-columns:20px 170px 1fr;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--rule);font-size:var(--fs-s);counter-increment:r}
.route li::before{content:counter(r);font-weight:600;color:var(--ink-3)}
.route li.x b{color:var(--bm)}
.signoff{border:1px solid var(--rule-strong);background:#fff;border-radius:var(--r);padding:.8rem .9rem;display:grid;gap:.7rem;max-width:760px}
.signoff .row2{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.signoff .row2 label.f{flex:0 1 280px}
.fb{display:flex;flex-wrap:wrap;gap:.4rem .6rem;align-items:center;margin-top:1rem;padding-top:.6rem;border-top:1px dashed var(--rule)}
.fb .btn{min-height:28px;padding:.2rem .6rem}
.fb .btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.fb label.f{flex:1 1 260px}

/* Mosaic: dense hairline modules */
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.mosaic > div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.55rem .7rem;min-height:66px}
.mosaic dt{font-size:var(--fs-xs);color:var(--ink-2)}
.mosaic dd{margin:.1rem 0 0;font-weight:600;font-size:var(--fs-m)}
.mosaic dd .src{display:block;margin-top:.2rem;font-weight:400;font-size:var(--fs-xs)}
.mosaic .gap{background:var(--red-wash)} .mosaic .gap dd{color:var(--red-ink)}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:.38rem .5rem;vertical-align:top}
.tbl thead th{font-weight:600;text-align:left;border-bottom:1px solid var(--ink);background:var(--sheet);position:sticky;top:0;z-index:1}
.tbl tfoot td{border-top:1px solid var(--ink);font-weight:600}
.tbl tbody tr:hover{background:#faf7ef}
.tbl input{min-height:28px;padding:.2rem .4rem}
.scroll{overflow:auto;max-height:52vh;border:1px solid var(--rule)}

/* Source stamps */
.stamp{display:inline-flex;align-items:center;gap:.25rem;font-size:.6875rem;font-weight:600;letter-spacing:.02em;padding:.05rem .4rem;border-radius:2px;border:1px solid currentColor;white-space:nowrap;vertical-align:middle}
.stamp.doc{color:var(--doc);background:var(--doc-wash)} .stamp.ans{color:var(--ans);background:var(--ans-wash)}
.stamp.bm{color:var(--bm);background:var(--bm-wash)} .stamp.def{color:var(--def);background:var(--def-wash)}
.stamp.gap{color:var(--red-ink);background:var(--red-wash)}
.stamp.est{color:var(--doc);background:transparent;border-style:dashed}
.mosaic.form dd input,.mosaic.form dd select{width:100%;font:inherit;font-weight:600;font-size:var(--fs-s);color:var(--ink);background:transparent;border:0;border-bottom:1px dotted var(--rule-strong);border-radius:0;padding:.1rem 0}
.mosaic.form dd input:focus-visible,.mosaic.form dd select:focus-visible{outline:2px solid var(--ans);outline-offset:2px;border-bottom-color:transparent}
.mosaic.form dd input[type=checkbox]{width:auto;border:0}
.tbl.mgmt input{width:100%;font:inherit;background:transparent;border:0;border-bottom:1px dotted var(--rule-strong);padding:.1rem 0}
.tbl.mgmt td.num input{text-align:right}
.cite{font-size:var(--fs-xs);color:var(--ink-2);border-left:1px solid var(--rule-strong);padding-left:.5rem;margin:.25rem 0 0;font-style:italic;max-width:70ch}
</style>
<style>
/* Drop zone */
.drop{border:1.5px dashed var(--rule-strong);border-radius:var(--r);padding:1.4rem;display:grid;gap:.4rem;justify-items:start;background:#fff;transition:background .18s ease-out,border-color .18s ease-out}
.drop.over{border-color:var(--doc);background:var(--doc-wash)}
.files{list-style:none;padding:0;margin:.75rem 0 0;border-top:1px solid var(--rule)}
.files li{display:grid;grid-template-columns:1fr auto auto;gap:.75rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--rule);font-size:var(--fs-s)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule);margin-top:.5rem}
.packs button{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:#fff;text-align:left;padding:.7rem .8rem;cursor:pointer;display:grid;gap:.15rem}
.packs button:hover{background:var(--doc-wash)}
.packs button[aria-pressed="true"]{background:var(--doc-wash);outline:1px solid var(--doc);outline-offset:-1px}
.packs b{font-size:var(--fs-s)} .packs span{font-size:var(--fs-xs);color:var(--ink-2)}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:.6rem 0}
.progress i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .2s ease-out}
.skel{height:14px;border-radius:2px;background:linear-gradient(90deg,#eeebe3,#f7f5ef,#eeebe3);background-size:200% 100%;animation:sh 1.1s linear infinite;margin:.4rem 0}
@keyframes sh{to{background-position:-200% 0}}

/* Interview */
.iv{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:1.5rem}
.qcard{border-top:1px solid var(--ink);padding-top:.9rem}
.qcard .qmeta{display:flex;gap:.5rem;align-items:center;font-size:var(--fs-xs);color:var(--ink-2);margin-bottom:.4rem}
.qcard .qtext{font-size:var(--fs-l);font-weight:600;margin:0 0 .35rem;max-width:60ch}
.qcard .why{background:var(--bm-wash);border:1px solid #e6d3a6;padding:.55rem .7rem;border-radius:var(--r);font-size:var(--fs-s);margin:.7rem 0;max-width:70ch}
.opts{display:grid;gap:.35rem;margin:.6rem 0;max-width:560px}
.opts label{display:flex;gap:.55rem;align-items:flex-start;border:1px solid var(--rule);padding:.5rem .65rem;border-radius:var(--r);cursor:pointer;background:#fff}
.opts label:hover{border-color:var(--ink-3)}
.opts input{margin-top:.2rem;accent-color:var(--ink)}
.opts label:has(input:checked){border-color:var(--ink);background:#faf8f1}
.qlist{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule);font-size:var(--fs-s)}
.qlist li button{width:100%;display:grid;grid-template-columns:16px 1fr;gap:.45rem;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:.4rem .2rem;cursor:pointer}
.qlist li button:hover{background:#faf7ef}
.qlist li button[aria-current="true"]{font-weight:600;background:#faf7ef}
.dot{width:14px;height:14px;border-radius:2px;margin-top:.2rem;border:1.5px solid var(--red);display:grid;place-items:center}
.dot.a{background:var(--ink);border-color:var(--ink)} .dot.d{background:var(--def-wash);border-color:var(--def)}

/* Hours method switch */
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:#fff;padding:.38rem .8rem;cursor:pointer;font-size:var(--fs-s);border-right:1px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* Levers + runs (trim-and-launch) */
.levers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.2rem 1.25rem}
.lever{display:grid;grid-template-columns:1fr 84px;gap:.4rem;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--rule)}
.lever label{font-size:var(--fs-s)} .lever .stamp{margin-left:.3rem}
.lever input[type=range]{grid-column:1/-1;accent-color:var(--ink);width:100%}
.runs .tbl td:first-child{font-weight:600}
.delta-up{color:var(--red-ink)} .delta-down{color:var(--ans)}

/* Flags */
.flags{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
.flags li{display:grid;grid-template-columns:70px 1fr;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--rule);font-size:var(--fs-s)}
.lvl{font-size:.6875rem;font-weight:700;letter-spacing:.03em}
.lvl.block{color:var(--red-ink)} .lvl.warn{color:var(--warn)} .lvl.info{color:var(--doc)} .lvl.pass{color:var(--ok)}

/* Board summary */
.board{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:1.5rem}
.bars{display:grid;gap:.35rem;margin-top:.4rem}
.bar{display:grid;grid-template-columns:118px 1fr 58px;gap:.5rem;align-items:center;font-size:var(--fs-s)}
.bar .track{height:12px;background:#f0ede4;position:relative;border:1px solid var(--rule)}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar .band{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--bm);border-right:1px dashed var(--bm);background:rgba(124,83,0,.08)}
.viewtog{margin-left:auto}

/* Trace strip (right) */
.trace{border-left:1px solid var(--rule-strong);background:var(--sheet);overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.9rem}
.trace .big{font-size:var(--fs-xxl);font-weight:650;letter-spacing:-.02em;line-height:1.1}
.trace .row{display:flex;justify-content:space-between;gap:.5rem;font-size:var(--fs-s);padding:.22rem 0;border-bottom:1px solid var(--rule)}
.trace .row b{font-weight:600}
.stack{display:flex;height:10px;border:1px solid var(--rule-strong);margin:.35rem 0 .2rem}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:.2rem .7rem;font-size:var(--fs-xs);color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;margin-right:.3rem;background:var(--c);vertical-align:0}
.pulse{transition:background-color .6s ease-out}
.pulse.hit{background-color:#fff4c7}
.redcount{color:var(--red-ink);font-weight:600}

/* Export */
pre.code{background:#1c1e21;color:#e9e6dc;padding:.8rem;border-radius:var(--r);font-size:var(--fs-xs);max-height:340px;overflow:auto;font-family:ui-monospace,Consolas,monospace}
.flow{list-style:none;margin:.5rem 0;padding:0;border-top:1px solid var(--rule)}
.flow li{display:grid;grid-template-columns:20px 1fr auto;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--rule);font-size:var(--fs-s);align-items:center}
.flow .box{width:16px;height:16px;border:1.5px solid var(--ink-2);border-radius:2px;display:grid;place-items:center;background:var(--sheet)}
.flow .done .box{background:var(--ink);border-color:var(--ink)} .flow .box.run{border-style:dashed}
.flow .done.sim .box{background:var(--ink-2);border-color:var(--ink-2)}
.rail .done .box::after,.flow .done .box::after,.dot.a::after{content:"";width:4px;height:8px;border:solid var(--sheet);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:.55rem 1rem;border-radius:var(--r);font-size:var(--fs-s);box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .18s ease-out}
.toast.show{opacity:1}

.rail li button[aria-current="step"]{box-shadow:none;font-weight:600}
.rail li button[aria-current="step"] .lbl{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}

@media (max-width:1180px){ .app{grid-template-columns:200px minmax(0,1fr)} .trace{grid-column:1/-1;border-left:0;border-top:1px solid var(--rule-strong);flex-direction:row;flex-wrap:wrap} .trace > *{flex:1 1 220px} .app{height:auto;min-height:100vh} .main{overflow:visible}
  .trace{position:sticky;bottom:0;z-index:5;border-top:1px solid var(--ink);padding:.6rem 1rem;gap:.4rem 1.25rem;box-shadow:0 -4px 12px rgba(0,0,0,.06)}
  .trace .big{font-size:var(--fs-xl)} .trace > :nth-child(3){display:none}
  .toast{bottom:auto;top:1rem} }
@media (max-width:1180px){ .tbl .opt2{display:none} }
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .app > *{min-width:0}
  .top{flex-wrap:wrap;gap:.4rem .75rem}
  .top .opp{flex:1 1 100%;order:3}
  .top .spacer{display:none} .top .host{margin-left:auto}
  .rail{position:sticky;top:0;z-index:6;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .trace > :nth-child(2){display:none} .trace > *{flex:1 1 140px}
  .rail{border-right:0;border-bottom:1px solid var(--rule-strong);padding:0;overflow-x:auto}
  .rail ol{display:flex} .rail li button{grid-template-columns:18px auto;border-bottom:0;border-right:1px solid var(--rule);white-space:nowrap;padding:.55rem .7rem}
  .rail .reds,.rail .lbl small,.rail .foot{display:none}
  .sheet{margin:.5rem;padding:1rem}
  .iv,.board{grid-template-columns:1fr}
  .top .opp .muted{display:none}
  .tbl .opt{display:none}
  .route li{grid-template-columns:20px 1fr;gap:.1rem .6rem} .route li > :last-child{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* What the model tells us: one price at five scales, with the summary collecting beside it */
#s-insights{container:ins / inline-size}
.ins{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem;align-items:start}
.ins-body{min-width:0}
@container ins (min-width:780px){ .ins{grid-template-columns:minmax(0,1fr) 236px} .spine{position:sticky;top:1rem;max-height:calc(100vh - 2rem);overflow:auto} }
.zl{display:grid;grid-template-columns:108px minmax(0,1fr);column-gap:1.25rem;border-top:1px solid var(--ink);padding:.9rem 0 1.9rem;scroll-margin-top:1rem}

  background:var(--sheet);color:var(--ink);box-shadow:0 30px 70px -20px rgba(28,30,33,.45);overflow:hidden}

@keyframes mapIn{from{opacity:0;transform:translateY(8px) scale(.985)}}
.m-head{display:flex;align-items:center;gap:.6rem 1.4rem;padding:.65rem 1rem;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.m-title{min-width:0}
.m-title h2{font-size:var(--fs-xl);margin:0}
.m-title p{margin:0}

.m-tools{display:flex;gap:.5rem;align-items:center}

.m-rail p{margin:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.sw.ring{background:none;border:1.5px dashed var(--ink-2)}
.m-stage{position:relative;overflow:hidden;background:#e5eae7;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.m-stage:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}

.m-stage > svg,.m-stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.m-stage > canvas[hidden]{display:none}
.m-stage > .m-street{position:absolute;inset:0;width:100%;height:100%;cursor:auto}
.m-street[hidden]{display:none}
.m-stage.street{cursor:auto;background:#f2f0ea}
.m-pin{width:22px;height:30px;cursor:grab;background:var(--ink);clip-path:path("M11 30C11 30 0 17.5 0 11a11 11 0 0 1 22 0c0 6.5-11 19-11 19z")}
.m-pin::after{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--sheet)}
.m-pin:active{cursor:grabbing}
.m-base .grat{fill:none;stroke:#cdd6d2;stroke-width:.6;vector-effect:non-scaling-stroke;pointer-events:none}
.m-base .rg{fill:var(--sheet);stroke:var(--ink-2);stroke-width:.8;vector-effect:non-scaling-stroke;fill-rule:evenodd;cursor:pointer;transition:fill .25s}
.m-base .rgs.under .rg{stroke:none}
.m-base .lad{fill:var(--sheet);stroke:#c9c4b5;stroke-width:.5;vector-effect:non-scaling-stroke;fill-rule:evenodd;cursor:pointer}
.m-base .rgline{fill:none;stroke:var(--ink-2);stroke-width:.9;vector-effect:non-scaling-stroke;pointer-events:none}
.m-base .rg:hover,.m-base .lad:hover{stroke:var(--ink);stroke-width:1.4}
.m-base .on{stroke:var(--ink)!important;stroke-width:2.2!important}
.m-heat{pointer-events:none;transform-origin:0 0;mix-blend-mode:multiply}
.m-top{pointer-events:none;overflow:hidden}
.m-top .pts circle{fill-opacity:.82;stroke:var(--sheet);stroke-width:.9;pointer-events:visiblePainted;cursor:pointer}
.m-top .pts circle:hover{fill-opacity:1;stroke:var(--ink);stroke-width:1.4}

.m-top .rgonly{pointer-events:auto;cursor:pointer}

.m-top .rgonly text{font-size:11px;font-weight:600;text-anchor:middle;fill:var(--ink)}
.m-top .lbl text{font-size:11px;fill:var(--ink-2);paint-order:stroke;stroke:var(--sheet);stroke-width:3px;stroke-linejoin:round;letter-spacing:.01em}
.m-top .lbl text.c0{font-size:12px;font-weight:600;fill:var(--ink)}
.m-top .lbl text.c3{font-size:10.5px}
.m-top .cdot{fill:var(--ink-2)}
.m-top .selring{fill:none;stroke:var(--ink);stroke-width:2}
.m-top .sellab rect{fill:var(--ink)} .m-top .sellab text{fill:var(--sheet);font-size:12px;font-weight:600}
.m-zoom{position:absolute;top:.75rem;left:.75rem;display:grid;border:1px solid var(--ink);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.m-zoom button{border:0;border-bottom:1px solid var(--rule-strong);background:none;min-width:36px;min-height:34px;font-size:1rem;font-weight:600;cursor:pointer}
.m-zoom button:last-child{border-bottom:0;font-size:var(--fs-xs)}
.m-zoom button:hover{background:#f0ede4}
.m-legend{position:absolute;right:.75rem;top:.75rem;max-width:min(270px,calc(100% - 5rem));max-height:calc(100% - 3.5rem);overflow:auto;background:rgba(255,253,248,.95);border:1px solid var(--rule-strong);border-radius:var(--r);padding:.45rem .7rem .55rem;font-size:var(--fs-xs);box-shadow:0 4px 14px -6px rgba(28,30,33,.25);cursor:auto}
.m-legend summary{font-weight:600;cursor:pointer;font-size:var(--fs-s)}
.m-legend h4{margin:.55rem 0 .25rem;font-size:var(--fs-xs);font-weight:600}
.m-legend ul{list-style:none;margin:0;padding:0;display:grid;gap:.15rem}
.m-legend li{display:flex;align-items:center;gap:.4rem}
.m-legend li .n{margin-left:auto;color:var(--ink-2);padding-left:.6rem}
.m-legend .sw{width:11px;height:11px}
.m-legend .sizes{display:flex;align-items:flex-end;gap:.6rem}
.m-legend .sizes circle{fill:none;stroke:var(--ink-2);stroke-width:1}
.m-legend .sizes ul{gap:.05rem;color:var(--ink-2)}
.m-legend .heatbar{display:grid;grid-template-columns:1fr auto;gap:.1rem .5rem;color:var(--ink-2)}
.m-legend .heatbar i{grid-column:1/-1;height:9px;border-radius:2px;background:linear-gradient(90deg,rgba(246,214,150,.35),#e8a846 35%,#ce6026 62%,#a82818 85%,#68140c)}
.m-legend .heatbar span:last-child{text-align:right}
.m-attr{position:absolute;right:0;bottom:0;margin:0;max-width:min(640px,100%);padding:.15rem .5rem;background:rgba(255,253,248,.88);font-size:.6875rem;color:var(--ink-2);line-height:1.3}
.m-tip{position:absolute;z-index:3;pointer-events:none;max-width:280px;background:var(--ink);color:var(--sheet);padding:.4rem .6rem;border-radius:var(--r);font-size:var(--fs-xs);box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.m-tip b{display:block;font-size:var(--fs-s)} .m-tip span{display:block;opacity:.88}
.m-status{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:var(--fs-m);color:var(--ink-2);background:rgba(229,234,231,.8);max-width:none}
.m-status[hidden]{display:none}
.m-table{grid-column:2;overflow:auto;padding:1rem 1.25rem 2rem}
.m-table h3:first-child{margin-top:0}
.m-table .scroll{max-height:none}
.m-tfilter{display:inline-grid;grid-auto-flow:column;align-items:center;gap:.5rem;font-size:var(--fs-s);margin-bottom:.3rem}
.m-tfilter input{width:260px}
.linkish{background:none;border:0;padding:0;font:inherit;font-weight:600;text-align:left;cursor:pointer;border-bottom:1px solid var(--rule-strong)}
.linkish:hover{border-bottom-color:var(--ink)}
.m-side{grid-column:3;border-left:1px solid var(--rule-strong);overflow:auto;padding:.9rem 1.05rem 1.5rem;background:var(--sheet)}
.m-side h3{margin:0 0 .35rem;font-size:var(--fs-l)}
.m-side h4{margin:1.3rem 0 .4rem;font-size:var(--fs-s)}
.m-side > p{margin:.2rem 0 .6rem}
.m-back{background:none;border:0;padding:0 0 .55rem;font-size:var(--fs-xs);color:var(--ink-2);cursor:pointer}
.m-back:hover{color:var(--ink);text-decoration:underline}
.m-placed{margin:.1rem 0 .5rem}
.m-warn{border:1px solid var(--red);background:var(--red-wash);color:var(--red-ink);padding:.45rem .6rem;border-radius:var(--r)}
.m-kv{grid-template-columns:repeat(2,minmax(0,1fr));margin:.6rem 0 .8rem}
.m-rank,.m-list,.m-fixlist{list-style:none;margin:.4rem 0;padding:0;border-top:1px solid var(--rule)}
.m-rank li,.m-list li{border-bottom:1px solid var(--rule)}
.m-rank button,.m-list button{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:.5rem;align-items:center;width:100%;background:none;border:0;padding:.32rem .1rem;text-align:left;cursor:pointer;font-size:var(--fs-s)}
.m-list button{grid-template-columns:minmax(0,1fr) auto}
.m-rank button:hover,.m-list button:hover{background:#f3f0e8}
.m-rank .nm,.m-list button span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-rank .mbar{height:7px;background:#ece8dd}
.m-rank .mbar i{display:block;height:100%;background:var(--ink-2)}
.m-read{padding-left:1.1rem;margin:.3rem 0;color:var(--ink-2)}
.m-read li{margin:.15rem 0}
.m-fix{display:grid;gap:.25rem;margin:.6rem 0 .5rem}
.m-fix label{font-size:var(--fs-xs);font-weight:600}
.m-fix .row{display:flex;gap:.4rem}
.m-fix input{flex:1;min-width:0;padding:.35rem .5rem;border:1px solid var(--rule-strong);border-radius:var(--r);background:#fff}
.m-fix input[aria-invalid="true"]{border-color:var(--red)}
.m-fix .btn{min-height:32px;padding:.25rem .7rem}
.m-fix .err{font-size:var(--fs-xs);color:var(--red-ink)}
.m-fixlist li{border-bottom:1px solid var(--rule);padding:.55rem 0 .1rem;display:grid}
.m-fixlist .m-name{background:none;border:0;padding:0;text-align:left;font-weight:600;cursor:pointer;font-size:var(--fs-s)}

@media (max-width:1180px){
  .m-body{grid-template-columns:minmax(0,1fr) 300px}
  .m-layers{display:inline-flex}
  .m-rail{display:none;position:absolute;z-index:6;left:0;top:0;bottom:0;width:min(260px,86vw);box-shadow:12px 0 28px -12px rgba(0,0,0,.35)}

  .mapdlg{width:100vw;height:100dvh;border:0;border-radius:0;margin:0}

<body>
<div class="app">
  <header class="top">
    <h1>Cost Model Builder</h1>
    <div class="opp" aria-live="polite"><span id="oppName" class="small">No opportunity loaded</span><span class="muted xs" id="oppMeta"></span></div>
    <div class="spacer"></div>
    <span class="host" id="hostMode" data-mode="standalone" title="Where this app is running">Standalone preview</span>
    <span class="xs muted" id="saveState" aria-live="polite"></span>
    <button class="btn" id="saveBtn" type="button" hidden>Save file</button>
    <button class="btn" id="guideBtn" type="button" aria-expanded="false" aria-controls="guide" aria-keyshortcuts="?">Guide</button>
    <button class="btn ghost" id="resetBtn" type="button">Start over</button>
  </header>

  <nav class="rail" aria-label="Survey stages" data-guide="el:rail">
    <ol id="steps"></ol>
    <p class="foot">Source stamps show where each value came from:<br>
      <button type="button" class="stamp doc" data-term="doc">DOC</button> extracted ·
      <button type="button" class="stamp est" data-term="est">EST</button> filled at the client's density ·
      <button type="button" class="stamp ans" data-term="ans">ANS</button> your answer ·
      <button type="button" class="stamp bm" data-term="bm">BM</button> past-bid benchmark ·
      <button type="button" class="stamp def" data-term="def">DEF</button> rate-card default</p>
  </nav>

  <main class="main" id="main">
    <div class="sheet">
      <section id="s-docs" aria-labelledby="h-docs"></section>
      <section id="s-spec" aria-labelledby="h-spec" hidden></section>
      <section id="s-questions" aria-labelledby="h-questions" hidden></section>
      <section id="s-sites" aria-labelledby="h-sites" hidden></section>
      <section id="s-price" aria-labelledby="h-price" hidden></section>
      <section id="s-board" aria-labelledby="h-board" hidden></section>
      <!--
      DIRECTION CONTRACT · "What the model tells us" · seed 22f882fd · candidate #7 (powers-of-ten zoom) + staging "accumulating précis"
      THESIS: A finished price is only trusted once you can say why it is that number. Read one price at five scales, £1 → one billed hour → one site → the estate → the contract, and each scale leaves one plain sentence behind.
      OWN-WORLD: The Surveyor's Clipboard, unchanged: ruled paper, graphite ink, hairlines, source stamps, red only for gaps and upward deltas.
      STORY: Each scale opens on its money figure in the margin, grown from the scale before, states its takeaway, then shows the one visual that proves it.
      FIRST VIEWPORT: The £1 as 100 pence squares in the margin-stack colours, and to the right the summary spine with all five sentences in pencil, inking and ticking as each scale is read.
      FORM: Hairline figures, tabular numerals, measured SVG only where a curve is the point; every visual has a table beside it.
      -->
      <section id="s-insights" aria-labelledby="h-insights" hidden></section>
      <section id="s-generate" aria-labelledby="h-generate" hidden></section>
    </div>
  </main>

  <div class="side">
    <div class="seg sidetog" role="region" aria-label="Side panel"><button type="button" data-pane="guide" aria-pressed="true">Guide</button><button type="button" data-pane="trace" aria-pressed="false">Price trace</button></div>
    <aside class="guide" id="guide" aria-labelledby="gTitle" hidden></aside>
    <aside class="trace" aria-label="Price trace" id="trace" data-guide="el:trace"></aside>
  </div>
</div>
<div class="spot" id="spot" hidden><div class="spot-hole" id="spotHole"></div></div>
<div class="spot-pop" id="spotPop" role="dialog" aria-modal="false" aria-labelledby="spotT" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr" id="gLive" aria-live="polite"></div>
<dialog class="mapdlg" id="mapDlg" aria-labelledby="mapT"></dialog>
<script src="data/reference-data.js"></script>
<script src="engine.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
<script src="map.js"></script>
<script src="map-street.js"></script>
</body>
</html>
